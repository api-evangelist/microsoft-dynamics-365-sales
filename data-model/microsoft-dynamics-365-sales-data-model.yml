  field-level model below is complete ONLY for Account. The entity set and the lifecycle
  edges come from Microsoft's own published sales-process documentation and the Web API
  EntityType reference, and each relationship records which of the two it came from. The
  authoritative, complete model for any given environment is the OData CSDL at
  /api/data/v9.2/$metadata — per-tenant and auth-gated, so it cannot be harvested here.

