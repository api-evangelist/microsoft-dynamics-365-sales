note: >-
  Dynamics 365 Sales has no test-mode key prefix and no magic test values — it is not a
  payments API. Isolation is achieved at the ENVIRONMENT level instead: you provision a
  separate Dataverse environment and point the same per-tenant base URL at it. Every artifact
  below is a real, published Microsoft surface; no test credentials are invented.

isolation_model: separate-environment
test_vs_live:
  mechanism: environment type, not key prefix
  key_prefixes: null
  note: >-
    The same OAuth 2.0 client and the same Web API path serve every environment. What
    changes is the {org} segment of https://{org}.api.crm.dynamics.com/api/data/v9.2 — so a
    misconfigured base URL writes to production. There is no in-band test/live signal on the
    token or on the request.

environments:
- type: Trial
  billable: false
  duration: 30 days (subscription-based trials can be extended per Microsoft policy)
  note: >-
    A trial environment allocates only a SINGLE web server, which matters for load testing —
    service protection limits are enforced per web server, so a trial hits them sooner than
    production.
  url: https://learn.microsoft.com/en-us/power-platform/admin/create-environment
- type: Developer
  billable: false
  note: >-
    Developer environments come with the Power Apps Developer Plan and are intended for
    building and testing against Dataverse at no cost.
- type: Sandbox
  billable: true
  note: >-
    Non-production environment intended for development and testing; supports copy and reset
    from production.
- type: Production
  billable: true

