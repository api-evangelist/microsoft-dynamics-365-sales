  rate_card: https://learn.microsoft.com/en-us/microsoft-copilot-studio/requirements-messages-management
  note: >-
    Learn, verbatim — "Copilot credits are not charged for specific Dynamics 365 Sales
    licenses." Credit consumption is tiered by agent feature: "Text and generative AI
    tools (basic)" for 18 tools, "Generative answer" for get_sales_record_summary and
    get_answer_from_sharepoint_documents.

