deployment:
  mode: both
  endpoint: https://agent365.svc.cloud.microsoft/mcp/environments/{EnvironmentID}/servers/msdyn_SalesMCPServer
  install: npm install -g @microsoft/dataverse
  package: https://www.npmjs.com/package/@microsoft/dataverse
  auth: oauth
  verified: probed
  note: >-
    Microsoft ships BOTH surfaces. (1) REMOTE: the Dynamics 365 Sales MCP server is a
    hosted HTTP endpoint on agent365.svc.cloud.microsoft, published verbatim in the Learn
    connect guide; the environment id segment is per-tenant. A live POST of
    {"jsonrpc":"2.0","id":1,"method":"tools/list"} to the documented placeholder id
    returned HTTP 400 {"code":"EndpointInvalid","message":"Environment id ... is
    invalid."} — the endpoint is reachable and answering, the tool schemas are gated
    behind a real tenant environment id plus Entra ID auth. (2) LOCAL-STDIO: the
    @microsoft/dataverse npm package describes itself as "CLI tool for Dataverse,
    including stdio MCP server. Preview." Dataverse also exposes a second remote MCP
    endpoint at https://{org}.api.crm.dynamics.com/api/mcp for CRUD over Sales records;
    the Learn guide tells you to connect both servers.

servers:
- name: dynamics-365-sales-mcp
  role: sales-agent-tools
  transport: http
  url: https://agent365.svc.cloud.microsoft/mcp/environments/{EnvironmentID}/servers/msdyn_SalesMCPServer
  auth: Microsoft Entra ID (OAuth 2.0)
  gated: true
  gate: per-tenant environment id + Entra ID token
- name: dataverse-mcp
  role: crud-over-sales-records
  transport: http
  url: https://{org}.api.crm.dynamics.com/api/mcp
  auth: Microsoft Entra ID (OAuth 2.0)
  gated: true
  note: >-
    Must be explicitly enabled per environment for non-Copilot-Studio MCP clients. Learn —
    "Allow access to Dataverse MCP Server from MCP clients."
- name: dataverse-cli-stdio
  role: local-stdio
  transport: stdio
  package: '@microsoft/dataverse'
  install: npm install -g @microsoft/dataverse
  status: preview

clients:
  supported:
  - Microsoft Copilot Studio
  - GitHub Copilot in Visual Studio Code (MCP: Add Server -> HTTP)
  unsupported:
  - name: Claude Desktop
    note: 'Learn, verbatim — "Claude Desktop isn''t supported at this time."'

prerequisites:
- Admin permissions in Dynamics 365 Sales
- Admin permissions in Microsoft Copilot Studio
- Dataverse MCP server access allowed for the environment (non-Copilot-Studio clients)
- Sufficient Copilot Studio credits for the tools invoked

