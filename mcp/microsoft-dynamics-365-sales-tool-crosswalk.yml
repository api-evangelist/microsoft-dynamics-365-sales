generated: '2026-08-13'
method: derived
source: >-
  mcp/microsoft-dynamics-365-sales-mcp.yml (tool list transcribed from Microsoft Learn)
  bound against the operationIds in openapi/microsoft-dynamics-365-sales-*-openapi.yml
note: >-
  The headline finding is a clean surface split. The Dynamics 365 Sales MCP server exposes
  NO CRUD tools — all 20 of its tools are AI/insight actions (msdyn_* Dataverse custom
  actions and Sales Qualification / Sales Opportunity agent capabilities) with no
  equivalent operation in the Dataverse Web API OData surface. CRUD over Sales records is
  a DIFFERENT server (the Dataverse MCP server at https://{org}.api.crm.dynamics.com/api/mcp),
  which Learn tells you to connect alongside it. So the crosswalk[] here is empty by
  construction, not by omission: mcp_only[] carries all 20 tools and rest_only[] carries
  every OpenAPI operation. Recording this is the point — an agent that connects only the
  Sales MCP server can read insights but cannot create a lead.

surfaces:
  openapi:
    files:
    - openapi/microsoft-dynamics-365-sales-accounts-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-contacts-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-leads-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-opportunities-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-quotes-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-salesorders-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-invoices-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-products-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-tasks-api-openapi.yml
    - openapi/microsoft-dynamics-365-sales-batch-api-openapi.yml
    base: https://{org}.api.crm.dynamics.com/api/data/v9.2
    gated: true
    gate: per-tenant environment + Microsoft Entra ID bearer token
  graphql:
    endpoint: null
    note: Microsoft publishes no GraphQL surface for Dynamics 365 Sales or Dataverse.
  mcp:
    url: https://agent365.svc.cloud.microsoft/mcp/environments/{EnvironmentID}/servers/msdyn_SalesMCPServer
    gated: true
    gate: 'tools/list returned HTTP 400 EndpointInvalid without a real tenant environment id'
  mcp_secondary:
    url: https://{org}.api.crm.dynamics.com/api/mcp
    name: Dataverse MCP server
    gated: true
    note: >-
      This is where CRUD tools live. Its tool list is documented separately at
      https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-mcp
      and is not transcribed here because it belongs to the Dataverse platform profile,
      not to Dynamics 365 Sales.

crosswalk: []

