  reason: >-
    msdyn_GetInsights returns a cross-entity "changed since last login" digest. It is
    adjacent to accounts_list / leads_list / opportunities_list but is not backed by them —
    it is a server-side composite with no parameters and no OData equivalent.
- tool: get_sales_record_summary
  reason: msdyn_SalesRecordSummary is a generative summarisation action over admin-configured fields.
- tool: get_sales_lead_catchup
  reason: msdyn_SalesLeadCatchup is a delta/summarisation action; leads_get returns raw fields, not a catchup.
- tool: get_sales_account_catchup
  reason: msdyn_SalesAccountCatchup is a delta/summarisation action.
- tool: get_sales_opportunity_catchup
  reason: msdyn_SalesOpportunityCatchup is a delta/summarisation action.
- tool: get_sharepoint_search_results
  reason: Searches SharePoint, not Dataverse; outside the Web API surface entirely.
- tool: get_answer_from_sharepoint_documents
  reason: Generative Q&A over SharePoint; outside the Web API surface entirely.

