- aid: microsoft-dynamics-365-sales:dynamics-365-sales-mcp-server
  name: Dynamics 365 Sales MCP Server
  description: >-
    Microsoft's hosted Model Context Protocol server for Dynamics 365 Sales. Exposes 20
    sales tools to any MCP-capable agent — lead and account research, competitor research,
    engagement summaries, lead qualification assessment, outreach email drafting,
    MEDDPICC opportunity health, opportunity signals, stakeholders, risks and pain points,
    record catch-ups, and SharePoint document search and Q&A. The endpoint is
    per-environment and authenticates with Microsoft Entra ID. It carries no CRUD tools —
    creating and updating Sales records goes through the Dataverse MCP server at
    https://{org}.api.crm.dynamics.com/api/mcp or the Dataverse Web API.
  humanURL: https://learn.microsoft.com/en-us/dynamics365/sales/connect-agents-to-model-context-protocol
  baseURL: https://agent365.svc.cloud.microsoft/mcp/environments/{EnvironmentID}/servers/msdyn_SalesMCPServer
  tags:
  - MCP
  - Agents
  - Sales
  - Copilot
  - Dynamics 365
