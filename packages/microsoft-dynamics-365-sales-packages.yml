  install: dotnet add package Microsoft.PowerPlatform.Dataverse.Client
  official: true
  version: 1.2.26
  published: '2026-07-02'
  note: >-
    Current .NET client (ServiceClient). The Learn service-protection-limits guidance names
    this class as the client that automatically honours the Retry-After duration on 429.
