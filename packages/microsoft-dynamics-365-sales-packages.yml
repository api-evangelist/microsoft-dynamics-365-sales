note: >-
  Dynamics 365 Sales has no product-specific client library. Every first-party client for
  Dynamics 365 Sales data is a Microsoft Dataverse client — Dataverse is the platform the
  Sales tables live in and the Web API (https://{org}.api.crm.dynamics.com/api/data/v9.2)
  is the Dataverse endpoint. All packages below are published by Microsoft.
